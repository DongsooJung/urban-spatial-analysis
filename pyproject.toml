[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uspatial"
version = "0.2.0"
description = "Spatial econometric models (OLS/SLM/SEM/SDM/GWR) for urban policy evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Dongsoo Jung", email = "jds068888@gmail.com" }]
keywords = [
    "spatial-econometrics",
    "gis",
    "urban-analytics",
    "pysal",
    "spatial-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "libpysal>=4.8.0",
    "spreg>=1.4.0",
    "esda>=2.5.0",
    "mgwr>=2.1.2",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.8.0",
    "mapclassify>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.9",
]
notebooks = [
    "jupyter>=1.0.0",
    "splot>=1.1.5",
    "folium>=0.15.0",
    "contextily>=1.4.0",
]

[project.urls]
Repository = "https://github.com/DongsooJung/urban-spatial-analysis"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
